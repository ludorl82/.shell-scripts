services:
  console:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER: ${USER}
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    # Override CONSOLE_IMAGE (e.g. in .env) to build/tag straight into a
    # private registry; the default keeps a purely local image.
    #
    # NOTE: on a host whose init system manages this container (a declarative
    # `oci-containers`-style unit), use this file for `build` ONLY — never
    # `up`. Both would claim the same container name and port 2222, and the
    # runtime settings below would silently diverge from the unit's.
    image: ${CONSOLE_IMAGE:-ludorl82/console-personal:latest}
    environment:
      - PASS=${PASS:-}
    ports:
      - "2222:22"
    volumes:
      - "/var/run/docker.sock:/var/run/docker-host.sock"
      - "${HOME}:${HOME}"
    # Backstop only, sized for a ~2G single-board host: earlyoom (or the
    # equivalent) is the primary protection, this just stops a runaway from
    # taking the host down with it. The swap allowance above the limit lets
    # zram absorb spikes before the cgroup kills anything. Raise both on a
    # machine with real memory.
    mem_limit: 1500m
    memswap_limit: 2400m
    restart: always

networks:
  default:
    enable_ipv6: true
    ipam:
      config:
        - subnet: fd00:1::/80
